<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>World of Circles</title>
    <style>
        * {padding:0; margin:0; overflow:hidden}
        body, html {background:black;}
        canvas, html {background:white;}
    </style>
</head>
<canvas id="canvas"></canvas>
<body id="body">
    <script>
    const ctx=document.getElementById("canvas").getContext("2d");

    let X=1000;
    let Y=X;
    let a=X/20;
    let tau=2*Math.PI;
    let rat=Math.sqrt(3)/2;
    let theta=0;

    let tspeed=1/40;
    let current=0;
    let w=[1, 0, 0, 0];
    let spinterval=20;
    let sts=[20, 20, 20, 20, 20, 20, 20];
    let cycle=0;
    
    draw();

    function resizecanvas(){
        ctx.canvas.width=X;
        ctx.canvas.height=Y;
        if (window.innerHeight/Y<window.innerWidth/X){            document.getElementById("body").style.width=String(window.innerWidth)+"px";
            document.getElementById("body").style.height=String(window.innerHeight)+"px";
            document.getElementById("canvas").style.height=String(window.innerHeight)+"px";
            document.getElementById("canvas").style.width=String(X*window.innerHeight/Y)+"px";
            document.getElementById("canvas").style.marginLeft=String((window.innerWidth-X*window.innerHeight/Y)/2)+"px";
            document.getElementById("canvas").style.marginTop="0px";
        }
        else{
            document.getElementById("body").style.width=String(window.innerWidth)+"px";
            document.getElementById("body").style.height=String(window.innerHeight)+"px";
            document.getElementById("canvas").style.width=String(window.innerWidth)+"px";
            document.getElementById("canvas").style.height=String(Y*window.innerWidth/X)+"px";
            document.getElementById("canvas").style.marginLeft="0px";
            document.getElementById("canvas").style.marginTop=String((window.innerHeight-Y*window.innerWidth/X)/2)+"px";
        }
    }

    function func(i, j){
        r=0;
        r+=w[0]*ripples(i, j);
        r+=w[1]*curtains(i, j);
        r+=w[2]*galaxy(i, j);
        r+=w[3]*flowers(i, j);
        return r;
    }

    function ripples(i, j){
        return (1+Math.cos((theta-.01*((i*a+(j%2)*a/2-cX)**2+(j*rat*a-cY)**2)/X)%tau))*a/2;
    }
    function curtains(i, j){
        return (1+2*((i+j)%2-.5)*wave*Math.cos(theta))*a/2;
    }
    function galaxy(i, j){
        return (1+Math.sin(theta-.01*(((i*a+(j%2)*a/2-cX)**2+(j*rat*a-cY)**2)/X)+Math.asin(Math.sign(j*rat*a-cY)*(i*a+(j%2)*a/2-cX)/Math.sqrt((j*rat*a-cY)**2+(i*a+(j%2)*a/2-cX)**2))*6))*a/4;
    }
    function flowers(i, j){
        if((i+2*(j%2))%3==(cycle+Math.floor(theta/(tau*.5)))%3) return a/2+(a*rat-a/2)*Math.abs(Math.cos(theta/2));
        else return a/2-(a*rat-a/2)*Math.abs(Math.cos(theta/2));
    }
    function test(i, j){
        return (Math.sin(theta+tau*(i-Math.floor(j/2))/(nX+nY/2))**6)*a/6+(Math.sin(theta+tau*(-i-Math.floor(j/2))/(nX+nY/2))**6)*a/6+(Math.sin(theta+tau*j/nY)**6)*a/6;
    }

    function draw(){
        resizecanvas();
        nX=26; nY=26;
        cX=X/2;cY=Y/2;
        ctx.strokeStyle="black";
        for(i=0;i<nX;i++){
            for(j=0;j<nY;j++){
                wave=1;
                ctx.beginPath();
                ctx.arc(i*a+(j%2)*a/2, j*rat*a, func(i, j), 0, tau);
                ctx.stroke();
            }
        }
        active=0;
        spinterval=0;
        for(i=0;i<w.length;i++){
            spinterval+=w[i]*sts[i];
            if(i==current){
                w[i]+=tspeed;
                if(w[i]>1)w[i]=1;
            }
            else if(w[i]>0) active+=1;
        }
        for(i=0;i<w.length;i++){
            if(i!=current && w[i]!=0)w[i]-=tspeed/active;
            if(w[i]<0)w[i]=0;
        }
    }

    setInterval(draw, 20);
    
    function spin(){
        theta+=+.1;
        if(theta>tau)cycle+=1;
        theta=theta%tau;
    }
    setInterval(spin, spinterval);

    document.addEventListener("keydown", (event) => {
        console.log(event.key);
        if(event.key=="q" || event.key=="w" || event.key=="e" || event.key=="r" || event.key=="t" || event.key=="y" || event.key=="u" || event.key=="i" || event.key=="o" || event.key=="p" || event.key=="a" || event.key=="s" || event.key=="d" || event.key=="f" || event.key=="g" || event.key=="h" || event.key=="j" || event.key=="k" || event.key=="l" || event.key=="z" || event.key=="x" || event.key=="c" || event.key=="v" || event.key=="b" || event.key=="n" || event.key=="m"){
        }
        draw();
    });

    document.addEventListener("mousedown", (event) => {
        current=(current+1)%w.length;
    });
    document.addEventListener("mousemove", (event) => {
        draw();
    });
    document.addEventListener("resize", (event) => {resizecanvas()});
    </script>
</body>
</html>
